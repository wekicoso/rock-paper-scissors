<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>rock-papper-scissors game</h1>
    <div id="buttons">
        <h3>choose some</h3>
        <button id="btnRock">ROCK</button>
        <button id="btnPaper">PAPER</button>
        <button id="btnScissors">SCISSORS</button>
    </div>

    <div id="result">
        <p id="human">init</p>
        <p id="computer">init</p>
        <p id="winner">init</p>
    </div>

    <div id="totalResult">
        <div class="text">
            <p class="score">total score</p>
            <p class="human">human: 0</p>
            <p class="computer">computer: 0</p>
        </div>
        <button class="reset">RESET</button>
    </div>
</body>
</html>
